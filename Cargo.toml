[package]
name = "melors"
version = "0.2.1"
edition = "2024"
description = "Keyboard-first terminal MP3 player with queue, search, and tag editing"
license = "MIT"
readme = "README.md"
repository = "https://github.com/TrVHau/melors"
homepage = "https://github.com/TrVHau/melors"
documentation = "https://docs.rs/melors"
keywords = ["mp3", "terminal", "tui", "music-player", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]
rust-version = "1.85"
include = [
	"src/**",
	"Cargo.toml",
	"README.md",
	"LICENSE",
]

[[bin]]
name = "melors"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
crossterm = "0.28"
dirs = "6.0"
fuzzy-matcher = "0.3"
id3 = "1.14"
rodio = "0.20"
ratatui = "0.29"
rustfft = "6.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
walkdir = "2.5"
